---
# docker compose up --detach
services:
  # https://www.home-assistant.io/installation/raspberrypi-other/#docker-compose
  homeassistant:
    depends_on:
      matter-server:
        condition: service_healthy
      thread-border-router:
        condition: service_started
    container_name: homeassistant
    hostname: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0 # for firmware updates only
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      TZ: America/New_York

  # https://github.com/matter-js/matterjs-server/blob/main/docs/docker.md
  # https://github.com/matter-js/matterjs-server/blob/main/docs/migration.md
  # https://github.com/matter-js/matterjs-server/blob/main/docker/matterjs-server/docker-compose.yml
  matter-server:
    container_name: matter-server
    image: ghcr.io/matter-js/matterjs-server:stable
    volumes:
      - ./matter-server:/data
    restart: unless-stopped
    read_only: true
    network_mode: host

  # https://openthread.io/guides/border-router/build-docker
  thread-border-router:
    container_name: otbr
    image: openthread/border-router:stable
    volumes:
      - ./otbr:/data
    devices:
      - /dev/net/tun:/dev/net/tun
      - /dev/ttyACM0:/dev/ttyACM0
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    network_mode: host
    environment:
      OT_RCP_DEVICE: spinel+hdlc+uart:///dev/ttyACM0
      OT_INFRA_IF: eth0
      OT_THREAD_IF: wpan0
      OT_LOG_LEVEL: 7
  
  # https://esphome.io/install/docker/#docker-compose
  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome:stable
    volumes:
      - ./esphome:/config
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    network_mode: host
    environment:
      ESPHOME_USERNAME: ${ESPHOME_USERNAME}
      ESPHOME_PASSWORD: ${ESPHOME_PASSWORD}

...
