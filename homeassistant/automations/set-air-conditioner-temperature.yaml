alias: Set Airconditioner Target Temperature
description: "Set the target temperature for the air conditioner according to a schedule"
triggers:
  - trigger: state
    entity_id:
      - schedule.air_conditioner_schedule
    attribute: temperature
conditions: []
actions:
  - action: climate.set_temperature
    metadata: {}
    target:
      entity_id: climate.air_conditioner
    data:
      temperature: "{{ state_attr('schedule.air_conditioner_schedule', 'temperature') }}"
mode: single
