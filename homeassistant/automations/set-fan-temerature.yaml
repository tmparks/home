alias: Set Fan Target Temperature
description: "Set the target temperature for the fan according to a schedule"
triggers:
  - trigger: state
    entity_id:
      - schedule.fan_schedule
    attribute: temperature
conditions: []
actions:
  - action: climate.set_temperature
    metadata: {}
    target:
      entity_id: climate.fan_thermostat
    data:
      temperature: "{{ state_attr('schedule.fan_schedule', 'temperature') }}"
mode: single
