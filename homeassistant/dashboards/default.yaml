# Default dashboard
views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Ad Blocker
            heading_style: title
          - type: tile
            entity: switch.ad_blocker
            name: Pause/Resume
            state_content:
              - state
              - last_changed
            features:
              - type: toggle
      - type: grid
        cards:
          - type: heading
            heading: Upstairs
            heading_style: title
          - type: thermostat
            entity: climate.upstairs_fan
          - type: thermostat
            entity: climate.air_conditioner
          - type: thermostat
            entity: climate.upstairs_heater
      - type: grid
        cards:
          - type: heading
            heading_style: title
            heading: Downstairs
          - type: thermostat
            entity: climate.downstairs_heater
