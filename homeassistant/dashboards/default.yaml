# Default dashboard
views:
  - type: sections
    sections:
      # Ad blocker
      - type: grid
        cards:
          - type: heading
            heading: Ad Blocker
            heading_style: title
          - type: tile
            entity: switch.ad_blocker
            name: Pause/Resume
            state_content:
              - state
              - last_changed
            features:
              - type: toggle

      # Window fan
      - type: grid
        cards:
          - type: heading
            heading: Window Fan
            heading_style: title
          - type: tile
            entity: climate.fan_thermostat
            name: On/Off
            features:
              - type: climate-hvac-modes
            features_position: bottom
          - type: tile
            entity: climate.fan_thermostat
            name: Temperature
            features:
              - type: target-temperature
            features_position: bottom

      # Air conditioner
      - type: grid
        cards:
          - type: heading
            heading: Air Conditioner
            heading_style: title
          - type: tile
            entity: climate.air_conditioner
            name: On/Off
            features:
              - style: icons
                type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - auto
            features_position: bottom
          - type: tile
            entity: climate.air_conditioner
            name: Temperature
            features:
              - type: target-temperature
            features_position: bottom
