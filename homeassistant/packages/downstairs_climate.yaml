# Downstairs climate control package

# Because initial_hvac_mode and target_temp are not specified,
# the thermostat will be restored to its previous state upon restart.
# Because preset temperatures (away, comfort, ...) are not integers,
# it is not possible to accidentally enable a preset.
climate:
  - platform: generic_thermostat
    name: Downstairs Heater
    unique_id: "2026.10.04.20.00.29"
    heater: switch.downstairs_plug
    target_sensor: sensor.downstairs_temperature
    ac_mode: false
    min_temp: 40
    max_temp: 80
    away_temp: 50.1    # not an integer (see target_temp_step)
    comfort_temp: 65.1 # not an integer (see target_temp_step)
    target_temp_step: 1.0
    precision: 0.1

# The schedule avoids preset temperatures (away, comfort, ...)
schedule:
  downstairs:
    name: Downstairs Schedule
    sunday: &daily
      - from: "00:00:00"
        to: "02:00:00"
        data:
          heat: 45
          cool: 80
      - from: "02:00:00"
        to: "03:00:00"
        data:
          heat: 50
          cool: 80
      - from: "03:00:00"
        to: "04:00:00"
        data:
          heat: 55
          cool: 80
      - from: "04:00:00"
        to: "05:00:00"
        data:
          heat: 60
          cool: 80
      - from: "05:00:00"
        to: "06:00:00"
        data:
          heat: 63
          cool: 80
      - from: "06:00:00"
        to: "21:00:00"
        data:
          heat: 65
          cool: 75
      - from: "21:00:00"
        to: "24:00:00"
        data:
          heat: 40
          cool: 80
    monday: *daily
    tuesday: *daily
    wednesday: *daily
    thursday: *daily
    friday: *daily
    saturday: *daily

automation:
  - alias: Apply Downstairs Heating Schedule
    description: 'Set a thermostat temperature according to a schedule'
    id: "2026.10.04.20.00.07"
    triggers:
      - trigger: state
        entity_id:
          - schedule.downstairs
        attribute: heat
      - trigger: state
        entity_id:
          - climate.downstairs_heater
        attribute: preset_mode
    conditions:
      - condition: state
        entity_id: climate.downstairs_heater
        attribute: preset_mode
        state:
          - none
    actions:
      - action: climate.set_temperature
        target:
          entity_id: climate.downstairs_heater
        data:
          temperature: "{{ state_attr('schedule.downstairs', 'heat') }}"
        metadata: {}
    mode: single
