# Schedule for window fan thermostat
# Copy to schedules/
fan_schedule:
  name: "Fan Thermostat Schedule"
  sunday: &daily
    - from: "00:00:00"
      to: "16:00:00"
      data:
        temperature: 70
    - from: "16:00:00"
      to: "24:00:00"
      data:
        temperature: 75
  monday: *daily
  tuesday: *daily
  wednesday: *daily
  thursday: *daily
  friday: *daily
  saturday: *daily
