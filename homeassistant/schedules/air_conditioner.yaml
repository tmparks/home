# Weekly chedule for air conditioner thermostat
# Copy to schedules/
air_conditioner_schedule:
  name: "Air Conditioner Thermostat Schedule"
  sunday: &weekend
    - from: "00:00:00"
      to: "04:00:00"
      data:
        temperature: 68
    - from: "04:00:00"
      to: "08:30:00"
      data:
        temperature: 70
    - from: "08:30:00"
      to: "14:00:00"
      data:
        temperature: 90
    - from: "14:00:00"
      to: "18:00:00"
      data:
        temperature: 80
    - from: "18:00:00"
      to: "20:00:00"
      data:
        temperature: 76
    - from: "20:00:00"
      to: "22:00:00"
      data:
        temperature: 72
    - from: "22:00:00"
      to: "24:00:00"
      data:
        temperature: 70
  monday: &weekday
    - from: "00:00:00"
      to: "04:00:00"
      data:
        temperature: 68
    - from: "04:00:00"
      to: "07:00:00"
      data:
        temperature: 70
    - from: "07:00:00"
      to: "14:00:00"
      data:
        temperature: 90
    - from: "14:00:00"
      to: "18:00:00"
      data:
        temperature: 80
    - from: "18:00:00"
      to: "20:00:00"
      data:
        temperature: 76
    - from: "20:00:00"
      to: "22:00:00"
      data:
        temperature: 72
    - from: "22:00:00"
      to: "24:00:00"
      data:
        temperature: 70
  tuesday: *weekday
  wednesday: *weekday
  thursday: *weekday
  friday: *weekday
  saturday: *weekend
